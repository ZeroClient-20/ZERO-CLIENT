name: Build ZERO CLIENT

on:
  push:
    branches: [main]
    paths:
      - 'ZERO-Client-1.8.9-LegacyFabric-source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source archive
        run: |
          mkdir -p source
          unzip -q ZERO-Client-1.8.9-LegacyFabric-source.zip -d source
          echo "Extracted files:"
          find source -maxdepth 3 -type f | head -100

      - name: Build with Gradle
        shell: bash
        run: |
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
            chmod +x "$WRAPPER"
            cd "$PROJECT_DIR"
            ./gradlew build --no-daemon
          elif find source -type f -name build.gradle -o -name build.gradle.kts | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y gradle
            BUILD_FILE="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            cd "$(dirname "$BUILD_FILE")"
            gradle build --no-daemon
          else
            echo "No Gradle wrapper or build.gradle found in the source archive."
            exit 1
          fi

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-CLIENT-1.8.9
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
