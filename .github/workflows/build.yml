name: Build ZERO CLIENT

on:
  push:
    branches: [main]
    paths:
      - 'ZERO-Client-1.8.9-LegacyFabric-source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract source archive
        run: |
          mkdir -p source
          unzip -q ZERO-Client-1.8.9-LegacyFabric-source.zip -d source
          echo "Extracted Gradle project files:"
          find source -type f \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradlew' \) -print

      - name: Build with Gradle
        shell: bash
        run: |
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
            chmod +x "$WRAPPER"
            cd "$PROJECT_DIR"
            ./gradlew build --no-daemon
          else
            BUILD_FILE="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            if [ -z "$BUILD_FILE" ]; then
              echo "No Gradle build file found in the source archive."
              exit 1
            fi
            cd "$(dirname "$BUILD_FILE")"
            gradle --version
            gradle build --no-daemon
          fi

      - name: List generated JARs
        if: success()
        run: |
          find source -type f -path '*/build/libs/*.jar' -print

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-CLIENT-1.8.9
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
